<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1900" viewBox="0 0 3200 1900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">A Universal Union functional model</title>
  <desc id="diagram-desc">A three-layer diagram. Foundations define actors, authority, visibility, records, and the process contract. The civic cycle moves from origination through deliberation, authorization, delegation, action, recording, challenge, repair, and federation. Privacy, security, abuse resistance, accessibility, interpretation, data lifecycle, governance, law, and anti-capture protections apply throughout.</desc>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#8a949f" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 7L0 14Z" fill="#77838e"/></marker>
    <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 7L0 14Z" fill="#4ee0c1"/></marker>
    <marker id="arrow-yellow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 7L0 14Z" fill="#ffd24d"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0 0L11 7L0 14Z" fill="#ff5964"/></marker>
  </defs>
  <rect width="3200" height="1900" fill="#080b0f"/>
  <rect width="3200" height="1900" fill="url(#grid)"/>
  <path d="M0 0H1536L1472 22H0Z" fill="#ff5964"/>
  <path d="M3200 0H1664L1728 22H3200Z" fill="#4d8dff"/>
  <rect x="42" y="42" width="6" height="1816" fill="#ff5964" opacity="0.72"/>
  <rect x="3152" y="42" width="6" height="1816" fill="#4d8dff" opacity="0.72"/>
  <text x="90" y="92" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="700" text-anchor="start" letter-spacing="4" class=""><tspan x="90" dy="0">A UNIVERSAL UNION · SYSTEM VIEW</tspan></text><text x="3110" y="92" fill="#77838e" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" text-anchor="end" letter-spacing="2.5" class=""><tspan x="3110" dy="0">CONCEPTUAL · REQUIREMENTS, NOT IMPLEMENTATION</tspan></text><text x="88" y="188" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="70" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="88" dy="0">AUU FUNCTIONAL MODEL</tspan></text><text x="92" y="244" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="92" dy="0">Three layers around one correctable civic cycle.</tspan></text><rect x="90" y="300" width="3020" height="310" rx="22" fill="#11161c" stroke="#39434d" stroke-width="3" opacity="1"/><text x="125" y="344" fill="#ffd24d" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" text-anchor="start" letter-spacing="2.4" class=""><tspan x="125" dy="0">FOUNDATIONS · DEFINE WHAT EVERY CONSEQUENTIAL FEATURE MEANS</tspan></text><rect x="125" y="380" width="700" height="185" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="151" y="435" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="151" dy="0">ACTORS + IDENTITY</tspan></text><text x="151" y="488.32" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="151" dy="0">person · pseudonym · role</tspan><tspan x="151" dy="31">collective · institution · federation</tspan></text><rect x="870" y="380" width="700" height="185" rx="18" fill="#151b21" stroke="#ffd24d" stroke-width="2.5" opacity="1"/><text x="896" y="435" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="896" dy="0">STANDING + AUTHORITY</tspan></text><text x="896" y="488.32" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="896" dy="0">source · scope · recognizer</tspan><tspan x="896" dy="31">limits · expiry · revocation</tspan></text><rect x="1615" y="380" width="700" height="185" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="1641" y="435" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="1641" dy="0">VISIBILITY + RECORDS</tspan></text><text x="1641" y="488.32" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="1641" dy="0">public · participant/member</tspan><tspan x="1641" dy="31">protected review · private</tspan></text><rect x="2360" y="380" width="700" height="185" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="2386" y="435" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="2386" dy="0">COMMON PROCESS CONTRACT</tspan></text><text x="2386" y="488.32" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="2386" dy="0">purpose · participation · method</tspan><tspan x="2386" dy="31">follow-through · appeal · review</tspan></text><rect x="90" y="660" width="3020" height="685" rx="22" fill="#11161c" stroke="#4ee0c1" stroke-width="3" opacity="1"/><text x="125" y="706" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" text-anchor="start" letter-spacing="2.4" class=""><tspan x="125" dy="0">THE CIVIC CYCLE · A MEMORY SPINE, NOT A FIXED WORKFLOW</tspan></text><text x="3070" y="706" fill="#77838e" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="700" text-anchor="end" letter-spacing="1.8" class=""><tspan x="3070" dy="0">SKIP STAGES ONLY WHEN THE PROCESS REALLY DOES</tspan></text><rect x="130" y="760" width="500" height="205" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="156" y="798" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="156" dy="0">1</tspan></text><text x="156" y="844" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="156" dy="0">ORIGINATE</tspan></text><text x="156" y="899.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="156" dy="0">Who may raise</tspan><tspan x="156" dy="29">the issue?</tspan></text><path d="M630 862L720 862" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="740" y="760" width="500" height="205" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="766" y="798" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="766" dy="0">2</tspan></text><text x="766" y="844" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="766" dy="0">DELIBERATE</tspan></text><text x="766" y="899.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="766" dy="0">Who is affected?</tspan><tspan x="766" dy="29">What is known or disputed?</tspan></text><path d="M1240 862L1330 862" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="1350" y="760" width="500" height="205" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="1376" y="798" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="1376" dy="0">3</tspan></text><text x="1376" y="844" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="1376" dy="0">AUTHORIZE</tspan></text><text x="1376" y="899.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="1376" dy="0">Who may decide what—</tspan><tspan x="1376" dy="29">and for how long?</tspan></text><path d="M1850 862L1940 862" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="1960" y="760" width="500" height="205" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="1986" y="798" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="1986" dy="0">4</tspan></text><text x="1986" y="844" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="1986" dy="0">DELEGATE</tspan></text><text x="1986" y="899.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="1986" dy="0">Who may use this authority?</tspan><tspan x="1986" dy="29">Can it be revoked?</tspan></text><path d="M2460 862L2550 862" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="2570" y="760" width="500" height="205" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="2596" y="798" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="2596" dy="0">5</tspan></text><text x="2596" y="844" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="2596" dy="0">ACT</tspan></text><text x="2596" y="899.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="2596" dy="0">Who carries it</tspan><tspan x="2596" dy="29">into the world?</tspan></text><path d="M2820 965V1030" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="2570" y="1040" width="500" height="215" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="2596" y="1078" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="2596" dy="0">6</tspan></text><text x="2596" y="1124" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="2596" dy="0">RECORD</tspan></text><text x="2596" y="1179.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="2596" dy="0">What was promised,</tspan><tspan x="2596" dy="29">attempted, and changed?</tspan></text><path d="M2570 1145L2480 1145" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="1960" y="1040" width="500" height="215" rx="18" fill="#151b21" stroke="#ffd24d" stroke-width="2.5" opacity="1"/><text x="1986" y="1078" fill="#ffd24d" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="1986" dy="0">7</tspan></text><text x="1986" y="1124" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="1986" dy="0">CHALLENGE</tspan></text><text x="1986" y="1179.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="1986" dy="0">Who may contest facts, process,</tspan><tspan x="1986" dy="29">authority, or effects?</tspan></text><path d="M1960 1145L1870 1145" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="1350" y="1040" width="500" height="215" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="1376" y="1078" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="1376" dy="0">8</tspan></text><text x="1376" y="1124" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="1376" dy="0">REPAIR</tspan></text><text x="1376" y="1179.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="1376" dy="0">What can be corrected,</tspan><tspan x="1376" dy="29">reversed, or contained?</tspan></text><path d="M1350 1145L1260 1145" fill="none" stroke="#4ee0c1" stroke-width="4" marker-end="url(#arrow-cyan)"/><rect x="740" y="1040" width="500" height="215" rx="18" fill="#151b21" stroke="#4ee0c1" stroke-width="2.5" opacity="1"/><text x="766" y="1078" fill="#4ee0c1" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2" class=""><tspan x="766" dy="0">9</tspan></text><text x="766" y="1124" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" text-anchor="start" letter-spacing="0" class=""><tspan x="766" dy="0">FEDERATE</tspan></text><text x="766" y="1179.48" fill="#aeb7c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0" class=""><tspan x="766" dy="0">How do collectives coordinate</tspan><tspan x="766" dy="29">without being absorbed?</tspan></text><path d="M740 1145H380V990H130" fill="none" stroke="#4ee0c1" stroke-width="4" stroke-dasharray="14 12" marker-end="url(#arrow-cyan)"/><text x="355" y="1096" fill="#4ee0c1" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="355" dy="0">a new or shared issue</tspan></text><text x="130" y="1302" fill="#77838e" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="700" text-anchor="start" letter-spacing="1.3" class=""><tspan x="130" dy="0">CHALLENGE MAY ATTACH EARLIER; FEDERATION MAY NEVER APPLY. THE LINE PRESERVES THE COMPLETE MODEL.</tspan></text><rect x="90" y="1400" width="3020" height="330" rx="22" fill="#11161c" stroke="#39434d" stroke-width="3" opacity="1"/><text x="125" y="1446" fill="#ffd24d" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" text-anchor="start" letter-spacing="2.4" class=""><tspan x="125" dy="0">CROSS-CUTTING PROTECTIONS · APPLY AT EVERY STAGE</tspan></text><rect x="145" y="1500" width="920" height="62" rx="31" fill="#151b21" stroke="#39434d" stroke-width="2" opacity="1"/><text x="605" y="1540" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="605" dy="0">PRIVACY + SECURITY</tspan></text><rect x="1135" y="1500" width="920" height="62" rx="31" fill="#151b21" stroke="#39434d" stroke-width="2" opacity="1"/><text x="1595" y="1540" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="1595" dy="0">ABUSE RESISTANCE + MODERATION</tspan></text><rect x="2125" y="1500" width="920" height="62" rx="31" fill="#151b21" stroke="#ffd24d" stroke-width="2" opacity="1"/><text x="2585" y="1540" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="2585" dy="0">ACCESSIBILITY + COMPREHENSION</tspan></text><rect x="145" y="1592" width="920" height="62" rx="31" fill="#151b21" stroke="#39434d" stroke-width="2" opacity="1"/><text x="605" y="1632" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="605" dy="0">CONTESTABLE INTERPRETATION</tspan></text><rect x="1135" y="1592" width="920" height="62" rx="31" fill="#151b21" stroke="#39434d" stroke-width="2" opacity="1"/><text x="1595" y="1632" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="1595" dy="0">DATA LIFECYCLE + OPERATIONS</tspan></text><rect x="2125" y="1592" width="920" height="62" rx="31" fill="#151b21" stroke="#39434d" stroke-width="2" opacity="1"/><text x="2585" y="1632" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="2585" dy="0">GOVERNANCE + LAW + ANTI-CAPTURE</tspan></text><text x="1600" y="1815" fill="#f5f1e8" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="0" class=""><tspan x="1600" dy="0">A vote is one stage. A complete civic process preserves source, scope, action, dissent, and correction.</tspan></text><text x="1600" y="1856" fill="#77838e" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" class=""><tspan x="1600" dy="0">A UNIVERSAL UNION · FUNCTIONAL ARCHITECTURE · V5 CONCEPT DRAFT</tspan></text>
</svg>